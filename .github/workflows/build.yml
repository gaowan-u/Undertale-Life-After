name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest
      options: --entrypoint /bin/bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: /home/user/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Install buildozer dependencies
        run: |
          /home/user/.venv/bin/pip install "Cython<3.0" wheel setuptools

      - name: Patch p4a to skip pip upgrade in build venv
        run: |
          for dir in /home/user/.venv /home/user/.buildozer; do
            find "$dir" -path "*/pythonforandroid/build.py" 2>/dev/null | while read -r f; do
              if grep -q 'pip install -U pip' "$f" 2>/dev/null; then
                echo "Patching $f"
                sed -i 's/pip install -U pip/true/g' "$f"
              else
                echo "Skipping $f (already patched or no upgrade line)"
              fi
            done
          done

      - name: Build with Buildozer
        run: |
          export HOME=/home/user
          export PATH=/home/user/.venv/bin:$PATH
          buildozer android debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Undertale-Life-After-APK
          path: ./bin/*.apk
