name: Build Android APK

on:
  push:
    branches-ignore:
      - data
      - gh-pages
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest
      options: --entrypoint /bin/bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: /home/user/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Install Python 3.11
        run: |
          apt-get update -qq
          apt-get install -y -qq software-properties-common 2>/dev/null
          add-apt-repository ppa:deadsnakes/ppa -y
          apt-get update -qq
          apt-get install -y -qq python3.11 python3.11-venv python3.11-dev
          # 把系统 python3 指向 3.11（p4a 直接读 /usr/bin/python3）
          update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          python3.11 -m venv /home/user/.venv
          /home/user/.venv/bin/pip install --upgrade "Cython<3.0" wheel pip buildozer setuptools

      - name: Build with Buildozer
        run: |
          export HOME=/home/user
          export PATH=/home/user/.venv/bin:$PATH
          # 清除容器预编译的 hostpython3（避免版本不匹配）
          rm -rf /home/user/.buildozer/android/platform/*/build/other_builds/hostpython3 2>/dev/null || true
          buildozer android debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Undertale-Life-After-APK
          path: ./bin/*.apk
