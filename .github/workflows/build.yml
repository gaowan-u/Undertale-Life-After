name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest
      options: --entrypoint /bin/bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: /home/user/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Install buildozer dependencies
        run: |
          /home/user/.venv/bin/pip install "Cython<3.0" wheel setuptools

      - name: Patch p4a to skip pip upgrade in build venv
        run: |
          /home/user/.venv/bin/python3 -c "
          import glob, sys
          targets = set()
          import pythonforandroid.build as m
          targets.add(m.__file__)
          for p in glob.glob(
              '/home/user/.buildozer/android/platform/**/pythonforandroid/build.py',
              recursive=True
          ):
              targets.add(p)
          for path in sorted(targets):
              print('Checking', path)
              with open(path) as f:
                  src = f.read()
              if 'pip install -U pip' not in src:
                  print('  no upgrade line, skipping')
                  continue
              src = src.replace('pip install -U pip', 'true')
              with open(path, 'w') as f:
                  f.write(src)
              print('  patched')
          "

      - name: Build with Buildozer
        run: |
          export HOME=/home/user
          export PATH=/home/user/.venv/bin:$PATH
          buildozer android debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Undertale-Life-After-APK
          path: ./bin/*.apk
