name: Build Android APK

on:
  push:
    branches-ignore:
      - data
      - gh-pages
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kivy/buildozer:latest
      options: --entrypoint /bin/bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: /home/user/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Install buildozer dependencies
        run: |
          /home/user/.venv/bin/pip install --upgrade "Cython<3.0" wheel pip setuptools

      - name: Pre-clone and patch p4a to skip pip upgrade in build venv
        run: |
          P4A_DIR=".buildozer/android/platform/python-for-android"
          if [ ! -d "$P4A_DIR" ]; then
            mkdir -p "$P4A_DIR"
            git clone --depth 1 -b master --single-branch \
              https://github.com/kivy/python-for-android.git "$P4A_DIR" 2>&1
          fi
          sed -i 's/pip install -U pip/true/g' "$P4A_DIR"/pythonforandroid/build.py
          echo "P4A patched at $P4A_DIR/pythonforandroid/build.py"

      - name: Build with Buildozer
        run: |
          export HOME=/home/user
          export PATH=/home/user/.venv/bin:$PATH
          buildozer android debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Undertale-Life-After-APK
          path: ./bin/*.apk
